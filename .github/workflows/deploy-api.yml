# Build the API Lambda container, push to ECR, and roll the Lambda over to the
# new image. Triggers when the API code, its docker image, or this workflow
# changes.
#
# Required repo configuration:
#   vars.AWS_REGION              e.g. us-east-1
#   vars.AWS_ACCOUNT_ID          12-digit AWS account ID
#   vars.AWS_DEPLOY_ROLE_ARN     IAM role assumed via OIDC (see terraform/modules/cicd)
#   vars.ECR_REPOSITORY          ECR repo name (defaults to xwar-engine-api)
#   vars.LAMBDA_FUNCTION_NAME    Lambda function name (defaults to xwar-engine-api)
name: Deploy API Lambda

on:
  push:
    branches: [main]
    paths:
      - "src/api/handler.py"
      - "src/api/data_loader.py"
      - "src/api/__init__.py"
      - "src/common/**"
      - "src/ml/archetype_clustering.py"
      - "docker/api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'xwar-engine-api' }}
      LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || 'xwar-engine-api' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: tags
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "image_sha=$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=$REGISTRY/$ECR_REPOSITORY:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ steps.tags.outputs.image_sha }}
            ${{ steps.tags.outputs.image_latest }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.image_latest }}
          cache-to: type=inline

      - name: Update Lambda function to new image
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "${{ steps.tags.outputs.image_sha }}" \
            --publish \
            >/dev/null

      - name: Wait for Lambda to settle
        run: |
          aws lambda wait function-updated-v2 \
            --function-name "$LAMBDA_FUNCTION_NAME"

      - name: Summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.tags.outputs.image_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lambda: \`$LAMBDA_FUNCTION_NAME\`" >> "$GITHUB_STEP_SUMMARY"
